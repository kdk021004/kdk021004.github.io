---
layout: default
---

<article class="container page-content">

  <header>
    <p class="hero-label">
      Blog
    </p>

    <h1>
      {{ page.title }}
    </h1>

    {% if page.date %}
      <p class="post-date">
        {{ page.date | date: "%Y.%m.%d" }}
      </p>
    {% endif %}
  </header>

  <div class="post-content">
    {{ content }}
  </div>

</article>
