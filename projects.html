---
layout: default
title: Projects
permalink: /projects/
---

<section class="section">
  <div class="container">

    <div class="section-header">
      <h1>Projects</h1>

      <p>
        지금까지 진행한 주요 개발 프로젝트와
        그 과정에서 담당한 작업을 정리합니다.
      </p>
    </div>


    <div class="project-grid">

      {% for project in site.projects %}

        <a
          class="project-card"
          href="{{ project.url | relative_url }}"
        >

          <h3>
            {{ project.title }}
          </h3>

          <p>
            {{ project.description }}
          </p>

          <p class="project-tech">
            {{ project.tech }}
          </p>

        </a>

      {% endfor %}

    </div>

  </div>
</section>
